sentence=DualSense (PS5) and DualShock 4 (PS4) support for ESP32, over a cable, a USB dongle, or the built-in radio.
paragraph=Either pad runs on any of the three links, and which one is on the other end is worked out from the product id or the report id rather than guessed. The protocol core decodes and builds real DualSense and DualShock 4 reports for both Bluetooth Classic and USB, including the touchpad, motion, the CRC32 Bluetooth output reports require, and on a DualSense the adaptive triggers. Transports are separate so the same core can run over Bluedroid L2CAP on the original ESP32 or over a USB Bluetooth dongle on the ESP32-S3. A companion HCI layer builds and parses raw host controller interface packets and drives the whole bring-up, pairing and connection sequence for the dongle route, plus enough L2CAP to carry HID, with no dependency on any particular USB stack.
